<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 지도 대학 위치 시각화</title>
    <!-- Tailwind CSS 로드 (UI 레이아웃 디자인용) -->
    <script src="https://jsdelivr.net"></script>
    <!-- 네이버 지도 API 최신 규격 (ncpKeyId 방식 및 geocoder 서브모듈 명시) -->
    <script type="text/javascript" src="https://naver.com"></script>
    <style>
        #map { min-height: 400px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex flex-col h-screen">
        <!-- 상단 헤더 -->
        <header class="bg-indigo-600 text-white p-4 shadow-md flex-none">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 주요 대학교 위치 및 정보 안내
            </h1>
            <p class="text-xs text-indigo-200 mt-1">Naver Maps API v3 주소 자동 변환 시스템</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <div class="flex flex-1 flex-col md:flex-row overflow-hidden">
            
            <!-- 왼쪽: 대학교 선택 목록 -->
            <aside class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col flex-none">
                <div class="p-4 border-b border-gray-100 bg-gray-50">
                    <h2 class="font-semibold text-gray-700 flex items-center gap-1">
                        📌 대학교 선택
                    </h2>
                </div>
                <!-- 대학교 리스트 공간 (데이터가 있으면 100% 무조건 먼저 뜹니다) -->
                <div id="uni-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                    <!-- JavaScript가 여기에 리스트를 생성합니다 -->
                </div>
            </aside>

            <!-- 오른쪽: 지도 및 상세 정보창 -->
            <main class="flex-1 flex flex-col relative overflow-hidden">
                <!-- 네이버 지도 영역 -->
                <div id="map" class="w-full flex-1"></div>

                <!-- 하단 상세 정보 카드 -->
                <div class="bg-white p-5 border-t border-gray-200 shadow-lg max-h-64 overflow-y-auto flex-none">
                    <div id="info-content">
                        <h2 class="text-lg font-bold text-gray-900 mb-1">ℹ️ 대학 정보</h2>
                        <p class="text-gray-500 text-sm">왼쪽 리스트나 지도의 마커를 클릭하시면 상세 정보가 표시됩니다.</p>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script>
        // 1. 대학교 데이터 세트 (앞으로 여기에 이름과 한글 주소만 추가하시면 됩니다!)
        const universityData = [
            {
                name: "한국예술종합학교",
                address: "서울특별시 성북구 화랑로32길 146",
                desc: "대한민국 유일의 국립 예술 전문 고등교육기관입니다. 음악, 연극, 영상, 무용, 미술, 전통예술 등 전문적인 예술 교육을 제공합니다.",
                url: "https://karts.ac.kr"
            },
            {
                name: "세종대학교",
                address: "서울특별시 광진구 능동로 209",
                desc: "인공지능 및 컴퓨터공학 분야와 호텔관광 경영, 애니메이션 학과 등이 전통적으로 강세를 보이는 사립 종합대학교입니다.",
                url: "https://sejong.ac.kr"
            },
            {
                name: "홍익대학교(세종)",
                address: "세종특별자치시 조치원읍 세종로 2639",
                desc: "디자인, 게임 그래픽, 광고 홍보 등 상용화 및 실무 중심의 융합형 인재를 양성하는 홍익대학교의 세종캠퍼스입니다.",
                url: "https://hongik.ac.kr"
            }
        ];

        // 2. 기본 지도 초기화 (서울 중심부 임시 지정)
        const mapOptions = {
            center: new naver.maps.LatLng(37.5665, 126.9780),
            zoom: 11,
            zoomControl: true,
            zoomControlOptions: {
                position: naver.maps.Position.TOP_RIGHT
            }
        };
        const map = new naver.maps.Map('map', mapOptions);

        const markers = [];
        const infoCard = document.getElementById('info-content');
        const listContainer = document.getElementById('uni-list');

        // 3. 지도 및 리스트 렌더링 엔진 구동
        function initUniversityMap() {
            // 네이버 지도 API 자체가 로드되지 않았을 경우 예외 처리
            if (typeof naver === 'undefined' || !naver.maps || !naver.maps.Service) {
                console.error("네이버 지도 API 라이브러리를 불러오지 못했습니다. Client ID나 URL 설정을 확인하세요.");
                alert("네이버 지도 인증에 실패했거나 로딩 중입니다. 콘솔 설정을 다시 확인해 주세요.");
                return;
            }

            universityData.forEach((uni, index) => {
                
                // [A] 주소를 좌표로 실시간 변환 (Geocoding API 핵심부)
                naver.maps.Service.geocode({ query: uni.address }, function(status, response) {
                    // 서버 응답 규격 방어 코드 구축
                    if (status !== naver.maps.Service.Status.OK || !response.v2 || !response.v2.addresses || response.v2.addresses.length === 0) {
                        console.warn('주소 변환에 실패한 항목:', uni.name, uni.address);
                        return;
                    }

                    const addrInfo = response.v2.addresses[0];
                    const point = new naver.maps.LatLng(addrInfo.y, addrInfo.x);

                    // 지도 위 마커 생성
                    const marker = new naver.maps.Marker({
                        position: point,
                        map: map,
                        title: uni.name,
                        animation: naver.maps.Animation.DROP
                    });

                    markers[index] = marker;

                    // 마커 클릭 시 상호작용 이벤트 바인딩
                    naver.maps.Event.addListener(marker, 'click', function() {
                        selectUniversity(index, point);
                    });

                    // 첫 번째 대학의 좌표를 기준으로 지도의 첫 중심점을 자동 정렬
                    if (index === 0) {
                        map.setCenter(point);
                    }
                });

                // [B] 좌측 사이드바 대학교 버튼 동적 생성 (지도가 안 떠도 리스트는 무조건 출력되도록 순서 배치)
                const listItem = document.createElement('button');
                listItem.className = "w-full text-left p-4 hover:bg-indigo-50 transition-colors border-l-4 border-transparent hover:border-indigo-500 focus:outline-none flex flex-col gap-1 cursor-pointer";
                listItem.innerHTML = `
                    <span class="font-bold text-gray-900">${uni.name}</span>
                    <span class="text-xs text-gray-500 truncate w-full">📍 ${uni.address}</span>
                `;
                
                // 리스트 아이템 클릭 이벤트
                listItem.addEventListener('click', () => {
                    if (markers[index]) {
                        const targetPos = markers[index].getPosition();
                        selectUniversity(index, targetPos);
                    } else {
                        // 혹시 비동기 통신 지연으로 마커가 생성되기 전 클릭 시 재탐색 처리
                        naver.maps.Service.geocode({ query: uni.address }, function(status, response) {
                            if (status === naver.maps.Service.Status.OK && response.v2.addresses.length > 0) {
                                const addrInfo = response.v2.addresses[0];
                                const point = new naver.maps.LatLng(addrInfo.y, addrInfo.x);
                                selectUniversity(index, point);
                            }
                        });
                    }
                });

                listContainer.appendChild(listItem);
            });
        }

        // 4. 대학 선택 시 화면 연동 제어 함수
        function selectUniversity(index, position) {
            const uni = universityData[index];

            // 부드러운 카메라 이동 및 줌 인 확대
            map.morph(position, 14);

            // 다른 마커들의 애니메이션을 끄고 선택된 마커만 강조 바운스 효과
            markers.forEach(m => { if(m) m.setAnimation(null); });
            if (markers[index]) {
                markers[index].setAnimation(naver.maps.Animation.BOUNCE);
                setTimeout(() => { if(markers[index]) markers[index].setAnimation(null); }, 1500);
            }

            // 하단 정보 패널 내용 업데이트
            infoCard.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-3 flex-wrap">
                        <h3 class="text-xl font-bold text-indigo-700">${uni.name}</h3>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded border border-gray-200">${uni.address}</span>
                    </div>
                    <p class="text-sm text-gray-600 leading-relaxed mt-1">${uni.desc}</p>
                    <div class="mt-2">
                        <a href="${uni.url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded shadow transition-all">
                            🔗 공식 홈페이지 방문하기
                        </a>
                    </div>
                </div>
            `;
        }

        // 브라우저 돔 트리가 준비되면 안전하게 맵 로딩 시작
        window.addEventListener('DOMContentLoaded', initUniversityMap);
    </script>
</body>
</html>
