<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 지도 대학 위치 시각화</title>
    <!-- Tailwind CSS (UI 레이아웃용) -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- 📍 여기 oapi.map.naver.com 주소가 확실하게 들어가 있습니다! -->
    <!-- ✨ 변경할 최신 신형 코드 (이것으로 바꿔 끼워주세요) -->
    <script type="text/javascript" src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=bduf7pv6qj"></script>
    
    <style>
        #map { min-height: 450px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex flex-col h-screen">
        <!-- 상단 헤더 -->
        <header class="bg-indigo-600 text-white p-4 shadow-md">
            <h1 class="text-xl font-bold flex items-center gap-2">🎓 주요 대학교 위치 및 정보 안내</h1>
            <p class="text-xs text-indigo-200 mt-1">Naver Maps API v3 주소 자동 변환 시스템</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <div class="flex flex-1 flex-col md:flex-row overflow-hidden">
            <!-- 왼쪽: 대학교 선택 목록 -->
            <aside class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col">
                <div class="p-4 border-b border-gray-100 bg-gray-50">
                    <h2 class="font-semibold text-gray-700">📌 대학교 선택</h2>
                </div>
                <div id="uni-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                    <!-- 대학 목록 버튼이 여기에 생성됩니다 -->
                </div>
            </aside>

            <!-- 오른쪽: 지도 및 상세 정보창 -->
            <main class="flex-1 flex flex-col relative overflow-hidden">
                <div id="map" class="w-full flex-1"></div>
                <div class="bg-white p-5 border-t border-gray-200 shadow-lg max-h-64 overflow-y-auto">
                    <div id="info-content">
                        <h2 class="text-lg font-bold text-gray-900 mb-1">ℹ️ 대학 정보</h2>
                        <p class="text-gray-500 text-sm">왼쪽 리스트나 지도의 마커를 클릭하시면 상세 정보가 표시됩니다.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // 대학교 데이터 (한글 도로명 주소 기반)
        const universityData = [
            {
                name: "한국예술종합학교",
                address: "서울특별시 성북구 화랑로32길 146",
                desc: "대한민국 유일의 국립 예술 전문 고등교육기관입니다.",
                url: "https://karts.ac.kr"
            },
            {
                name: "세종대학교",
                address: "서울특별시 광진구 능동로 209",
                desc: "호텔관광 경영, 애니메이션, 컴퓨터공학 학과 등이 강세를 보이는 종합대학입니다.",
                url: "https://sejong.ac.kr"
            },
            {
                name: "홍익대학교(세종)",
                address: "세종특별자치시 조치원읍 세종로 2639",
                desc: "디자인, 게임 그래픽 분야 실무 중심의 인재를 양성하는 홍익대학교 세종캠퍼스입니다.",
                url: "https://hongik.ac.kr"
            }
        ];

        let map = null;
        const markers = [];
        const infoCard = document.getElementById('info-content');
        const listContainer = document.getElementById('uni-list');

        function initApp() {
            // 1. 왼쪽 대학교 목록부터 강제로 화면에 먼저 띄우기
            renderUniversityList();

            // 2. 네이버 지도 정상 로드 확인 후 지도 생성
            if (typeof naver === 'undefined' || !naver.maps) {
                console.error("네이버 지도 API 라이브러리 로드 실패");
                return;
            }

            const mapOptions = {
                center: new naver.maps.LatLng(37.5665, 126.9780),
                zoom: 11,
                zoomControl: true
            };
            map = new naver.maps.Map('map', mapOptions);

            // 3. 한글 주소를 좌표로 자동 변환하여 마커 찍기
            if (naver.maps.Service && naver.maps.Service.geocode) {
                geocodeUniversities();
            }
        }

        function renderUniversityList() {
            listContainer.innerHTML = "";
            universityData.forEach((uni, index) => {
                const listItem = document.createElement('button');
                listItem.className = "w-full text-left p-4 hover:bg-indigo-50 border-l-4 border-transparent hover:border-indigo-500 flex flex-col gap-1 cursor-pointer";
                listItem.innerHTML = `
                    <span class="font-bold text-gray-900">${uni.name}</span>
                    <span class="text-xs text-gray-500 truncate w-full">📍 ${uni.address}</span>
                `;
                listItem.addEventListener('click', () => {
                    if (markers[index]) {
                        selectUniversity(index, markers[index].getPosition());
                    }
                });
                listContainer.appendChild(listItem);
            });
        }

        function geocodeUniversities() {
            universityData.forEach((uni, index) => {
                naver.maps.Service.geocode({ query: uni.address }, function(status, response) {
                    if (status !== naver.maps.Service.Status.OK || !response.v2.addresses.length) return;

                    const addr = response.v2.addresses[0];
                    const point = new naver.maps.LatLng(addr.y, addr.x);

                    const marker = new naver.maps.Marker({
                        position: point,
                        map: map,
                        title: uni.name,
                        animation: naver.maps.Animation.DROP
                    });

                    markers[index] = marker;

                    naver.maps.Event.addListener(marker, 'click', function() {
                        selectUniversity(index, point);
                    });

                    if (index === 0 && map) map.setCenter(point);
                });
            });
        }

        function selectUniversity(index, position) {
            const uni = universityData[index];
            if (map) map.morph(position, 14);

            markers.forEach(m => { if(m) m.setAnimation(null); });
            if (markers[index]) {
                markers[index].setAnimation(naver.maps.Animation.BOUNCE);
                setTimeout(() => { if(markers[index]) markers[index].setAnimation(null); }, 1500);
            }

            infoCard.innerHTML = `
                <div class="flex flex-col gap-2">
                    <h3 class="text-xl font-bold text-indigo-700">${uni.name}</h3>
                    <p class="text-xs text-gray-500">📍 ${uni.address}</p>
                    <p class="text-sm text-gray-600 mt-1">${uni.desc}</p>
                    <div class="mt-2">
                        <a href="${uni.url}" target="_blank" class="inline-block text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded shadow">
                            🔗 공식 홈페이지 방문하기
                        </a>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
