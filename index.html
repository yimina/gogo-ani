<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 지도 대학 위치 시각화</title>
    <!-- Tailwind CSS 로드 (깔끔한 UI 디자인용) -->
    <script src="https://jsdelivr.net"></script>
    <!-- 네이버 지도 API 최신 규격 로드 (주소 변환 서브모듈 geocoder 포함) -->
    <script type="text/javascript" src="https://naver.com"></script>
    <style>
        /* 지도 내 마커 보정 및 기본 스타일 */
        #map { min-height: 400px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex flex-col h-screen">
        <!-- 상단 헤더 -->
        <header class="bg-indigo-600 text-white p-4 shadow-md">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 주요 대학교 위치 및 정보 안내
            </h1>
            <p class="text-xs text-indigo-200 mt-1">Naver Maps API v3 주소 자동 변환 템플릿</p>
        </header>

        <!-- 메인 콘텐츠 영역 (좌측 리스트, 우측 지도 및 정보) -->
        <div class="flex flex-1 flex-col md:flex-row overflow-hidden">
            
            <!-- 왼쪽: 대학교 선택 목록 -->
            <aside class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col">
                <div class="p-4 border-b border-gray-100 bg-gray-50">
                    <h2 class="font-semibold text-gray-700 flex items-center gap-1">
                        📌 대학교 선택
                    </h2>
                </div>
                <!-- 대학교 리스트가 동적으로 생성되는 공간 -->
                <div id="uni-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                    <!-- JavaScript가 여기에 리스트를 채웁니다 -->
                </div>
            </aside>

            <!-- 오른쪽: 지도 및 상세 정보창 -->
            <main class="flex-1 flex flex-col relative">
                <!-- 네이버 지도 영역 -->
                <div id="map" class="w-full flex-1"></div>

                <!-- 하단 상세 정보 카드 (반응형 고정 레이아웃) -->
                <div class="bg-white p-5 border-t border-gray-200 shadow-lg max-h-64 overflow-y-auto">
                    <div id="info-content">
                        <h2 class="text-lg font-bold text-gray-900 mb-1">ℹ️ 대학 정보</h2>
                        <p class="text-gray-500 text-sm">왼쪽 리스트나 지도의 마커를 클릭하시면 상세 정보가 표시됩니다.</p>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script>
        // 1. 대학교 데이터 설정 (여기에 한글 도로명 주소만 정확히 적어주시면 됩니다!)
        const universityData = [
            {
                name: "한국예술종합학교",
                address: "서울특별시 성북구 화랑로32길 146",
                desc: "대한민국 유일의 국립 예술 전문 고등교육기관입니다. 음악, 연극, 영상, 무용, 미술, 전통예술 등 양질의 예술 교육을 제공합니다.",
                url: "https://karts.ac.kr"
            },
            {
                name: "세종대학교",
                address: "서울특별시 광진구 능동로 209",
                desc: "인공지능 및 컴퓨터공학 분야와 호텔관광 경영, 애니메이션 학과 등이 전통적으로 강세를 보이는 명문 사립대학입니다.",
                url: "https://sejong.ac.kr"
            },
            {
                name: "홍익대학교(세종)",
                address: "세종특별자치시 조치원읍 세종로 2639",
                desc: "디자인, 게임 그래픽, 광고 홍보 등 실무 중심의 융합형 인재를 양성하는 홍익대학교의 세종캠퍼스입니다.",
                url: "https://hongik.ac.kr"
            }
        ];

        // 2. 지도 초기화 (기본 중심지는 서울역 근처로 임시 설정)
        const mapOptions = {
            center: new naver.maps.LatLng(37.5665, 126.9780),
            zoom: 12,
            zoomControl: true,
            zoomControlOptions: {
                position: naver.maps.Position.TOP_RIGHT
            }
        };
        const map = new naver.maps.Map('map', mapOptions);

        // 마커와 주소 데이터를 매칭해 저장해둘 배열
        const markers = [];
        const infoCard = document.getElementById('info-content');
        const listContainer = document.getElementById('uni-list');

        // 3. 주소를 좌표로 자동 변환하여 지도에 표시하는 핵심 함수
        function initUniversityMap() {
            universityData.forEach((uni, index) => {
                
                // 네이버 Geocoding API 호출
                naver.maps.Service.geocode({ query: uni.address }, function(status, response) {
                    if (status !== naver.maps.Service.Status.OK) {
                        console.error('주소 변환 실패:', uni.name, uni.address);
                        return;
                    }

                    const result = response.v2.addresses[0];
                    if (!result) return;

                    // 변환된 위도(y), 경도(x) 좌표 생성
                    const point = new naver.maps.LatLng(result.y, result.x);

                    // 지도 위 마커 생성
                    const marker = new naver.maps.Marker({
                        position: point,
                        map: map,
                        title: uni.name,
                        animation: naver.maps.Animation.DROP
                    });

                    // 생성된 마커 저장
                    markers[index] = marker;

                    // [이벤트] 마커 클릭 시 정보 업데이트 및 화면 이동
                    naver.maps.Event.addListener(marker, 'click', function() {
                        selectUniversity(index, point);
                    });

                    // 첫 번째 대학의 위치로 지도의 초기 중심점 맞추기
                    if (index === 0) {
                        map.setCenter(point);
                    }
                });

                // 4. 좌측 사이드바에 대학교 리스트 항목 동적 생성
                const listItem = document.createElement('button');
                listItem.className = "w-full text-left p-4 hover:bg-indigo-50 transition-colors border-l-4 border-transparent hover:border-indigo-500 focus:outline-none flex flex-col gap-1";
                listItem.innerHTML = `
                    <span class="font-bold text-gray-900">${uni.name}</span>
                    <span class="text-xs text-gray-500 truncate w-full">${uni.address}</span>
                `;
                
                // [이벤트] 리스트 클릭 시 해당 마커 위치로 이동
                listItem.addEventListener('click', () => {
                    if (markers[index]) {
                        const targetPos = markers[index].getPosition();
                        selectUniversity(index, targetPos);
                    } else {
                        // 간혹 비동기 로딩이 덜 끝났을 경우 주소 재검색 후 이동
                        naver.maps.Service.geocode({ query: uni.address }, function(status, response) {
                            if (status === naver.maps.Service.Status.OK && response.v2.addresses[0]) {
                                const res = response.v2.addresses[0];
                                const point = new naver.maps.LatLng(res.y, res.x);
                                selectUniversity(index, point);
                            }
                        });
                    }
                });

                listContainer.appendChild(listItem);
            });
        }

        // 5. 대학이 선택되었을 때 화면 전환 및 하단 상세정보 업데이트 함수
        function selectUniversity(index, position) {
            const uni = universityData[index];

            // 지도 부드럽게 이동 및 줌 레벨 확대
            map.morph(position, 15);

            // 모든 마커 애니메이션 초기화 후 선택된 마커만 바운스 효과
            markers.forEach(m => { if(m) m.setAnimation(null); });
            if (markers[index]) {
                markers[index].setAnimation(naver.maps.Animation.BOUNCE);
                // 1.5초 후 튀는 애니메이션은 멈추도록 설정 (가독성 방해 방지)
                setTimeout(() => { markers[index].setAnimation(null); }, 1500);
            }

            // 하단 정보창 UI 업데이트
            infoCard.innerHTML = `
                <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-3 flex-wrap">
                        <h3 class="text-xl font-bold text-indigo-700">${uni.name}</h3>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded border border-gray-200">📍 ${uni.address}</span>
                    </div>
                    <p class="text-sm text-gray-600 leading-relaxed mt-1">${uni.desc}</p>
                    <div class="mt-2">
                        <a href="${uni.url}" target="_blank" class="inline-flex items-center gap-1 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded shadow transition-all">
                            🔗 공식 홈페이지 방문하기
                        </a>
                    </div>
                </div>
            `;
        }

        // 페이지 로드 완료 시 맵 엔진 구동
        window.addEventListener('DOMContentLoaded', initUniversityMap);
    </script>
</body>
</html>
