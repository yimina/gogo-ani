<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애니메이션 대학 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<!-- ★ 1. 네이버 클라우드 플랫폼에서 발급한 Client ID(ncpKeyId)로 바꾸세요 -->
<script>
  const NAVER_CLIENT_ID = "YOUR_NCP_CLIENT_ID";
</script>

<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --ink: #14213d;
    --sub: #5b6679;
    --line: #d5dce8;
    --pink: #e8336d;
    --yellow: #ffc93c;
    --blue: #2f6fed;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app { display: grid; grid-template-columns: 400px 1fr; height: 100%; }

  /* 왼쪽 패널 */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
  h1 { font-family: "Do Hyeon", sans-serif; font-weight: 400; font-size: 30px; margin: 0 0 4px; letter-spacing: .5px; }
  h1 span { background: linear-gradient(transparent 62%, var(--yellow) 62%); }
  header p { margin: 0 0 14px; font-size: 13px; color: var(--sub); }
  .search {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
  }
  .search:focus { outline: 3px solid rgba(47,111,237,.25); border-color: var(--blue); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 999px;
    border: 1.5px solid var(--line); background: #fff; color: var(--sub); cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .count { padding: 10px 20px; font-size: 12.5px; color: var(--sub); border-bottom: 1px solid var(--line); }

  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li button {
    all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer;
    padding: 14px 20px; border-bottom: 1px solid var(--line); border-left: 4px solid transparent;
  }
  li button:hover { background: #f5f7fb; }
  li button:focus-visible { outline: 3px solid rgba(47,111,237,.35); outline-offset: -3px; }
  li.active button { background: #fff6f9; border-left-color: var(--pink); }
  .name { font-weight: 700; font-size: 16px; }
  .tag { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 500; padding: 1px 7px; border-radius: 4px; background: #e6edff; color: var(--blue); vertical-align: 2px; }
  .dept { font-size: 13.5px; margin-top: 4px; }
  .addr { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .empty { padding: 30px 20px; color: var(--sub); font-size: 14px; }
  .note { padding: 10px 20px; font-size: 11.5px; color: var(--sub); border-top: 1px solid var(--line); background: #fafbfd; }

  /* 지도 */
  main { position: relative; min-height: 0; }
  #map { width: 100%; height: 100%; }
  .map-msg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 30px; background: var(--bg); color: var(--sub); line-height: 1.7; font-size: 14px;
  }
  .map-msg.show { display: flex; }
  .map-msg code { background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); }

  /* 정보창 */
  .iw { padding: 14px 16px; min-width: 230px; max-width: 280px; font-family: "Noto Sans KR", sans-serif; }
  .iw b { font-size: 15px; display: block; margin-bottom: 4px; }
  .iw div { font-size: 12.5px; color: #4a5568; margin-bottom: 2px; }
  .iw .links { margin-top: 10px; display: flex; gap: 8px; }
  .iw a {
    font-size: 12.5px; text-decoration: none; padding: 5px 10px; border-radius: 6px;
    background: var(--ink); color: #fff;
  }
  .iw a.alt { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }

  /* 마커 */
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--pink); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .pin.on { background: var(--blue); }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    main { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1><span>애니메이션 대학 지도</span></h1>
      <p>전국 애니메이션 관련 학과 · 학교를 지도에서 찾아보세요</p>
      <input id="q" class="search" type="search" placeholder="학교명, 학과, 지역 검색" aria-label="검색">
      <div class="filters" id="regionFilters" role="group" aria-label="지역 필터"></div>
      <div class="filters" id="typeFilters" role="group" aria-label="학교 유형 필터"></div>
    </header>
    <div class="count" id="count"></div>
    <ul id="list"></ul>
    <div class="note">※ 학과명·입시 정보는 변경될 수 있으니 학교 공식 사이트에서 꼭 확인하세요.</div>
  </aside>
  <main>
    <div id="map"></div>
    <div class="map-msg" id="mapMsg"></div>
  </main>
</div>

<script>
/* ★ 2. 학교 데이터 — 여기에 학교를 추가/수정하세요 (주소는 지도에서 자동으로 좌표 변환됩니다)
   type: "대학교" | "전문대학" | "예술대학" 등 자유롭게 */
const SCHOOLS = [
  { id: 1, name: "한국예술종합학교 영상원", type: "예술대학", region: "서울",
    dept: "애니메이션과", address: "서울특별시 성북구 화랑로32길 146-37", url: "https://www.karts.ac.kr" },
  { id: 2, name: "세종대학교", type: "대학교", region: "서울",
    dept: "만화애니메이션텍학과", address: "서울특별시 광진구 능동로 209", url: "https://www.sejong.ac.kr" },
  { id: 3, name: "청강문화산업대학교", type: "전문대학", region: "경기",
    dept: "애니메이션 관련 전공", address: "경기도 이천시 마장면 서이천로 389", url: "https://www.ck.ac.kr" },
  { id: 4, name: "서울예술대학교", type: "예술대학", region: "경기",
    dept: "애니메이션 관련 전공", address: "경기도 안산시 단원구 예술대학로 171", url: "https://www.seoularts.ac.kr" },
  { id: 5, name: "동서대학교", type: "대학교", region: "부산",
    dept: "애니메이션 관련 학과", address: "부산광역시 사상구 주례로 47", url: "https://www.dongseo.ac.kr" }
];

/* ---------- 상태 ---------- */
let map = null, infoWindow = null, mapReady = false;
const markers = {};              // id -> naver.maps.Marker
const coords = {};               // id -> naver.maps.LatLng
let activeId = null;
const filter = { q: "", region: "전체", type: "전체" };

/* ---------- 필터 UI ---------- */
function buildChips(containerId, values, key) {
  const box = document.getElementById(containerId);
  ["전체", ...values].forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = v;
    b.setAttribute("aria-pressed", v === "전체");
    b.onclick = () => {
      filter[key] = v;
      box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
      render();
    };
    box.appendChild(b);
  });
}
buildChips("regionFilters", [...new Set(SCHOOLS.map(s => s.region))], "region");
buildChips("typeFilters", [...new Set(SCHOOLS.map(s => s.type))], "type");
document.getElementById("q").addEventListener("input", e => { filter.q = e.target.value.trim(); render(); });

function filtered() {
  const q = filter.q.toLowerCase();
  return SCHOOLS.filter(s =>
    (filter.region === "전체" || s.region === filter.region) &&
    (filter.type === "전체" || s.type === filter.type) &&
    (!q || [s.name, s.dept, s.region, s.address].join(" ").toLowerCase().includes(q))
  );
}

/* ---------- 목록 + 마커 렌더 ---------- */
function render() {
  const items = filtered();
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  document.getElementById("count").textContent = `${items.length}개 학교`;

  if (!items.length) {
    ul.innerHTML = '<div class="empty">조건에 맞는 학교가 없어요. 검색어나 필터를 바꿔보세요.</div>';
  }
  items.forEach(s => {
    const li = document.createElement("li");
    if (s.id === activeId) li.className = "active";
    li.innerHTML = `<button type="button">
      <div class="name">${s.name}<span class="tag">${s.type}</span></div>
      <div class="dept">${s.dept}</div>
      <div class="addr">${s.address}</div></button>`;
    li.querySelector("button").onclick = () => select(s.id, true);
    ul.appendChild(li);
  });

  if (mapReady) {
    const visible = new Set(items.map(s => s.id));
    Object.entries(markers).forEach(([id, m]) => m.setMap(visible.has(+id) ? map : null));
    fitToVisible(items);
  }
}

function fitToVisible(items) {
  const pts = items.map(s => coords[s.id]).filter(Boolean);
  if (!pts.length) return;
  if (pts.length === 1) { map.setCenter(pts[0]); map.setZoom(14); return; }
  const b = new naver.maps.LatLngBounds(pts[0], pts[0]);
  pts.forEach(p => b.extend(p));
  map.fitBounds(b, { top: 60, right: 60, bottom: 60, left: 60 });
}

/* ---------- 선택 ---------- */
function pinIcon(on) {
  return { content: `<div class="pin ${on ? "on" : ""}"></div>`, anchor: new naver.maps.Point(15, 30) };
}
function select(id, fromList) {
  activeId = id;
  const s = SCHOOLS.find(x => x.id === id);
  document.querySelectorAll("#list li").forEach(li => li.classList.remove("active"));
  render_active();
  if (!mapReady || !coords[id]) return;

  Object.entries(markers).forEach(([mid, m]) => m.setIcon(pinIcon(+mid === id)));
  map.panTo(coords[id]);
  if (map.getZoom() < 13) map.setZoom(14);

  const q = encodeURIComponent(s.name);
  infoWindow.setContent(`<div class="iw">
    <b>${s.name}</b>
    <div>${s.dept}</div>
    <div>${s.address}</div>
    <div class="links">
      <a href="${s.url}" target="_blank" rel="noopener">홈페이지</a>
      <a class="alt" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">길찾기</a>
    </div></div>`);
  infoWindow.open(map, markers[id]);
}
function render_active() {
  const items = filtered();
  const lis = document.querySelectorAll("#list li");
  items.forEach((s, i) => { if (lis[i]) lis[i].classList.toggle("active", s.id === activeId); });
  const on = document.querySelector("#list li.active");
  if (on) on.scrollIntoView({ block: "nearest" });
}

/* ---------- 네이버 지도 초기화 ---------- */
function showMapMessage(html) {
  const el = document.getElementById("mapMsg");
  el.innerHTML = html; el.classList.add("show");
}

function initMap() {
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(36.5, 127.8), zoom: 7,
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
  });
  infoWindow = new naver.maps.InfoWindow({ borderWidth: 0, backgroundColor: "#fff", anchorSize: new naver.maps.Size(12, 10), pixelOffset: new naver.maps.Point(0, -8) });
  naver.maps.Event.addListener(map, "click", () => infoWindow.close());
  mapReady = true;

  // 주소 → 좌표 (Geocoder). 학교마다 한 번씩 요청.
  let pending = SCHOOLS.length;
  SCHOOLS.forEach(s => {
    naver.maps.Service.geocode({ query: s.address }, (status, res) => {
      if (status === naver.maps.Service.Status.OK && res.v2.addresses.length) {
        const a = res.v2.addresses[0];
        const pos = new naver.maps.LatLng(+a.y, +a.x);
        coords[s.id] = pos;
        const m = new naver.maps.Marker({ position: pos, map, title: s.name, icon: pinIcon(false) });
        naver.maps.Event.addListener(m, "click", () => select(s.id));
        markers[s.id] = m;
      } else {
        console.warn("주소 변환 실패:", s.name, s.address);
      }
      if (--pending === 0) render();
    });
  });
}

// 인증 실패 시 (Client ID 오류 / 허용 도메인 미등록)
window.navermap_authFailure = function () {
  showMapMessage("네이버 지도 인증에 실패했어요.<br>Client ID가 맞는지, <b>Web 서비스 URL</b>에 현재 주소(예: <code>http://localhost</code>)가 등록돼 있는지 확인하세요.");
};

function loadNaver() {
  if (!NAVER_CLIENT_ID || NAVER_CLIENT_ID === "bduf7pv6qj") {
    showMapMessage("지도를 보려면 파일 상단의 <code>NAVER_CLIENT_ID</code>에<br>네이버 클라우드 플랫폼에서 발급한 Client ID를 넣어주세요.<br>(그 전에도 왼쪽 목록은 사용할 수 있어요.)");
    return;
  }
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(NAVER_CLIENT_ID)}&submodules=geocoder`;
  s.onerror = () => showMapMessage("네이버 지도 스크립트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
  s.onload = () => {
    // geocoder 서브모듈까지 준비되면 초기화 (중복 실행 방지)
    if (naver.maps.Service) initMap();
    else naver.maps.onJSContentLoaded = () => { if (!mapReady) initMap(); };
  };
  document.head.appendChild(s);
}

render();
loadNaver();
</script>
</body>
</html>
