<style>

  }

  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

  .flabel { font-size: 11.5px; color: var(--sub); margin-top: 10px; }

  }
  li button:hover { background: #f5f7fb; }
  li button:focus-visible { outline: 3px solid rgba(47,111,237,.35); outline-offset: -3px; }
  li.active button { background: #fff6f9; border-left-color: var(--pink); }
  .name { font-weight: 700; font-size: 16px; }
  .tag { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 500; padding: 1px 7px; border-radius: 4px; background: #e6edff; color: var(--blue); vertical-align: 2px; }
  .dept { font-size: 13.5px; margin-top: 4px; }
  .addr { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .detail { padding: 2px 20px 16px 24px; border-bottom: 1px solid var(--line); background: #fff6f9; border-left: 4px solid var(--pink); }
  .detail h3 { font-size: 13.5px; margin: 6px 0 8px; }
  .detail dl { margin: 0 0 8px; display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 13px; }
  .detail dt { color: var(--sub); }

  .gt.s1 { background: var(--blue); } .gt.s2 { background: #1f9d6b; } .gt.s3 { background: #6b7280; }
  .typ { margin: 8px 0 10px; padding: 8px 12px 4px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 8px; }
  .typ dl { margin-bottom: 6px; }
  .th { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }

  .ann { display: flex; width: fit-content; align-items: center; gap: 8px; margin: 5px 0 3px; padding: 3px 12px 3px 4px; border-radius: 999px; background: #e8f7f0; border: 1px solid #bfe8d4; font-size: 12.5px; }
  .ann i { font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #1f9d6b; color: #fff; }

  .ann em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--pink); }
  .ann.final { background: #fff6dc; border-color: #f1d58a; }

  .rbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px; background: var(--line); max-width: 260px; }

  .vt { font: inherit; font-size: 13.5px; font-weight: 500; padding: 8px 16px; border: 0; background: #fff; color: var(--sub); cursor: pointer; }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin: 0 0 10px; }

  .dn { font-size: 12px; font-weight: 500; color: var(--ink); padding: 1px 3px; align-self: flex-start; }

  .ev:focus-visible { outline: 3px solid rgba(47,111,237,.45); outline-offset: 1px; }

  .mitem { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 12px 120px 1fr; gap: 10px; align-items: baseline; width: 100%; cursor: pointer; padding: 9px 10px; margin-bottom: 6px; background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .mitem:hover { border-color: var(--ink); }

  .mdot { width: 10px; height: 10px; border-radius: 3px; background: var(--kc); align-self: center; }

  .ftoggle { display: none; }

    html, body { height: auto; }

</style>

<body class="cal-mode">
<div class="app">
  <aside>
    <header>
      <h1><span>만화, 애니메이션 대학 정보</span></h1>
      <p>전국 만화·애니메이션 관련 학과의 입시 일정과 위치를 한눈에 확인하세요</p>
      <input id="q" class="search" type="search" placeholder="학교명, 학과, 지역 검색" aria-label="검색">
      <button type="button" class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filterBox">필터 열기 ▾</button>
      <div id="filterBox">
      <div class="filters" id="regionFilters" role="group" aria-label="지역 필터"></div>
      <div class="filters" id="typeFilters" role="group" aria-label="학교 유형 필터"></div>
      <div class="flabel">전형 시기</div>
      <div class="filters" id="seasonFilters" role="group" aria-label="전형 시기 필터"></div>
      <div class="flabel">실기 여부</div>
      <div class="filters" id="trackFilters" role="group" aria-label="실기 여부 필터"></div>
      <div class="fhint">※ 전형 정보가 확인되지 않은 학교는 시기·실기 필터를 켜면 숨겨져요.</div>
      </div>
    </header>
    <div class="count" id="count"></div>
    <ul id="list"></ul>
    <div class="note">※ 학과명·입시 정보는 변경될 수 있으니 학교 공식 사이트에서 꼭 확인하세요.</div>
  </aside>
  <main>
    <div class="viewtabs" role="group" aria-label="보기 전환">
      <button type="button" class="vt" id="tabMap" aria-pressed="false">지도</button>
      <button type="button" class="vt on" id="tabCal" aria-pressed="true">달력</button>
    </div>
    <div id="map"></div>
    <div id="cal" class="cal"></div>
    <div class="map-msg" id="mapMsg"></div>
  </main>

<script>
/* ★ 학교 데이터는 같은 폴더의 universities.json 에서 불러옵니다. (학교 추가·수정은 그 파일만 고치면 돼요)
   ※ 파일을 더블클릭(file://)으로 열면 브라우저가 JSON 로딩을 막아요. localhost(예: VS Code Live Server)로 여세요. */
const DATA_URL = "universities.json";
let SCHOOLS = [];
let ADMISSION = {};
let CHECKED_AT = "";

async function loadData() {
  const res = await fetch(DATA_URL, { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  CHECKED_AT = json.checkedAt || "";
  SCHOOLS = (json.schools || [])
    .filter(x => {
      const ok = x && x.name && x.address;
      if (!ok) console.warn("name/address 가 없어 건너뜀:", x);
      return ok;
    })
    .map((x, i) => ({ type: "", region: "", dept: "", url: "#", ...x, id: i + 1 }));
  SCHOOLS.forEach(x => {
    const adm = x.admission || {};
    ADMISSION[x.id] = { ...adm, seasons: [groupHas(adm.susi) && "수시", groupHas(adm.jeongsi) && "정시"].filter(Boolean) };
  });
}

/* ---------- 상태 ---------- */
let map = null, infoWindow = null, mapReady = false;
const markers = {};              // id -> naver.maps.Marker
const coords = {};               // id -> naver.maps.LatLng
let activeId = null;
const filter = { q: "", region: "전체", type: "전체", season: "전체", track: "전체" };

/* ---------- 필터 UI ---------- */
function buildChips(containerId, values, key) {
  const box = document.getElementById(containerId);
  ["전체", ...values].forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = v;
    b.setAttribute("aria-pressed", v === "전체");
    b.onclick = () => {
      filter[key] = v;
      box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
      render();
    };
    box.appendChild(b);
  });
}
function buildAllChips() {
  buildChips("regionFilters", [...new Set(SCHOOLS.map(s => s.region).filter(Boolean))], "region");
  buildChips("typeFilters", [...new Set(SCHOOLS.map(s => s.type).filter(Boolean))], "type");
  buildChips("seasonFilters", ["수시", "정시"], "season");
  buildChips("trackFilters", ["실기", "비실기"], "track");
}
document.getElementById("q").addEventListener("input", e => { filter.q = e.target.value.trim(); render(); });

function filtered() {
  const q = filter.q.toLowerCase();
  return SCHOOLS.filter(s =>
    (filter.region === "전체" || s.region === filter.region) &&
    (filter.type === "전체" || s.type === filter.type) &&
    (filter.season === "전체" || ((ADMISSION[s.id] || {}).seasons || []).includes(filter.season)) &&
    (filter.track === "전체" || ((ADMISSION[s.id] || {}).track || []).includes(filter.track)) &&
    (!q || [s.name, s.dept, s.region, s.address].join(" ").toLowerCase().includes(q))
  );
}

/* ---------- 목록 + 마커 렌더 ---------- */
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function pd(str) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str || "")) return null;
  const [y, m, d] = str.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getMonth() === m - 1 ? dt : null;
}
function fd(dt, withYear) {
  return (withYear ? dt.getFullYear() + "." : "") + (dt.getMonth() + 1) + "." + dt.getDate() + "(" + WD[dt.getDay()] + ")";
}
function fmtRange(a, b) {
  const s = pd(a); if (!s) return "";
  const e = pd(b);
  if (!e || +e === +s) return fd(s, true);
  return fd(s, true) + " ~ " + fd(e, e.getFullYear() !== s.getFullYear());
}

function hasData(o) {
  if (o == null) return false;
  if (typeof o === "string") return o.trim() !== "";
  if (Array.isArray(o)) return o.some(hasData);
  if (typeof o === "object") return Object.entries(o).some(([k, v]) => !["reference", "offered", "label", "kind"].includes(k) && hasData(v));
  return false;
}
function groupHas(g) { return !!g && (g.offered === true || hasData(g)); }
function gunText(g) { return Array.isArray(g.gun) ? g.gun.join(", ") : (g.gun || ""); }
function admGroups(a) {
  const list = [];
  const su = a.susi || {}, jg = a.jeongsi || {};
  list.push({ key: "susi", name: "수시", g: su, jeong: false });
  list.push({ key: "jeongsi", name: "정시" + (gunText(jg) ? "(" + gunText(jg) + ")" : ""), g: jg, jeong: true });
  (a.etc || []).forEach(e => list.push({ key: "etc", name: e.label || "기타 전형", g: e, jeong: false }));
  return list;
}

function ratioHtml(items) {
  const on = items.filter(it => it[1] && String(it[1]).trim());
  if (!on.length) return "";
  const text = on.map(it => `<span class="rk"><i style="background:${it[2]}"></i>${it[0]} ${it[1]}</span>`).join("");
  const allNum = on.every(it => /^\d+(\.\d+)?\s*%?$/.test(String(it[1]).trim()));
  const bar = allNum
    ? `<div class="rbar" aria-hidden="true">${on.map(it => `<i style="flex:${parseFloat(it[1])};background:${it[2]}"></i>`).join("")}</div>`
    : "";
  return `<div class="rkl">${text}</div>${bar}`;
}

function ratioOf(r, jeong) {
  r = r || {};
  return jeong
    ? ratioHtml([["수능", r.suneung, "#1f9d6b"], ["내신", r.grade, "#2f6fed"], ["실기", r.practical, "#e8336d"]])
    : ratioHtml([["서류", r.document, "#334155"], ["내신", r.grade, "#2f6fed"], ["실기", r.practical, "#e8336d"], ["면접", r.interview, "#f59e0b"]]);
}

function ddayTxt(str) {
  const d = pd(str); if (!d) return "";
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((d - t) / 86400000);
  return n > 0 ? "D-" + n : n === 0 ? "D-DAY" : "발표 완료";
}
function annHtml(str, label, final, ref) {
  const d = pd(str); if (!d) return "";
  const dd = ref ? "" : ddayTxt(str);
  return `<div class="ann${final ? " final" : ""}"><i>${label}</i><b>${fd(d, true)}</b>${dd ? `<em>${dd}</em>` : ""}</div>`;
}

function anyDates(o) {
  if (!o) return false;
  const ap = o.apply || {};
  return !!pd(ap.start) || !!pd(o.finalAnnounce) ||
    (o.stages || []).some(st => pd(st.date) || pd(st.announce)) ||
    (o.types || []).some(anyDates);
}

function groupRows(g, jeong, ref, isType) {
  const ap = g.apply || {};
  const applyTxt = [fmtRange(ap.start, ap.end), ap.note ? "(" + ap.note + ")" : ""].filter(Boolean).join(" ");
  const stageRows = (g.stages || []).map(st => {
    const head = [st.method, fmtRange(st.date, st.endDate)].filter(Boolean).join("<br>");
    const ann = annHtml(st.announce, "발표", false, ref);
    return [st.label || "단계", head + ann + ratioOf(st.ratio, jeong)];
  });
  const anyStageRatio = (g.stages || []).some(st => ratioOf(st.ratio, jeong));
  const hasTypes = (g.types || []).some(groupHas);
  return [
    jeong && !isType ? ["원서 접수 군", gunText(g)] : null,
    ["원서 접수", applyTxt],
    ...stageRows,
    ["최종 합격자 발표", annHtml(g.finalAnnounce, "최종", true, ref)],
    isType ? null : ["참고 표시", ref && anyDates(g) ? "이전 학년도 자료를 참고용으로 표시한 일정이에요." : ""],
    isType ? null : [hasTypes ? "전체 모집인원" : "모집인원", g.quota],
    ["전형 방법", g.process],
    [anyStageRatio ? "공통 반영 비율" : "반영 비율", ratioOf(g.ratio, jeong)],
    ["참고", g.note]
  ].filter(r => r && r[1]);
}

function typeHtml(t, jeong, ref) {
  const rows = groupRows(t, jeong, ref, true);
  const q = t.quota ? `<span class="qb">모집 ${t.quota}</span>` : "";
  return `<div class="typ"><div class="th"><b>${t.name || "전형"}</b>${q}</div>${rows.length ? dl(rows) : '<p class="muted">전형 세부 정보가 아직 없어요.</p>'}</div>`;
}

function dl(rows) { return `<dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl>`; }

function admissionHtml(s) {
  const a = ADMISSION[s.id] || {};
  const common = [
    ["실기 여부", (a.track || []).length ? (a.track.join(" · ") + " 전형") : ""],
    ["전형 방법 요약", a.process], ["실기·준비물", a.practical], ["참고", a.note]
  ].filter(r => r[1]);

  const sections = admGroups(a).map(gr => {
    const has = groupHas(gr.g);
    if (!has && gr.key === "etc") return "";
    const ref = !!gr.g.reference;
    const rows = has ? groupRows(gr.g, gr.jeong, ref, false) : [];
    const types = (gr.g.types || []).filter(groupHas).map(t => typeHtml(t, gr.jeong, ref || !!t.reference)).join("");
    const cls = gr.key === "susi" ? "s1" : gr.key === "jeongsi" ? "s2" : "s3";
    const inner = (rows.length ? dl(rows) : "") + types;
    return `<div class="grp"><div class="gh"><span class="gt ${cls}">${gr.name}</span></div>${inner || '<p class="muted">아직 입력된 정보가 없어요.</p>'}</div>`;
  }).join("");

  const adm = a.admissionUrl || s.url;
  const q = encodeURIComponent(s.name + " 신입생 모집요강");
  const src = (a.sources || []).map(x => `<a class="srcl" href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(" · ");
  return `<div class="detail"><h3>입시 전형</h3>${common.length ? dl(common) : ""}${sections}
    <div class="links">
      <a href="${adm}" target="_blank" rel="noopener">입학 안내 바로가기</a>
      <a class="alt" href="https://search.naver.com/search.naver?query=${q}" target="_blank" rel="noopener">모집요강 검색</a>
    </div>
    <p class="muted small">${src ? "출처: " + src + " · " : ""}확인일 ${CHECKED_AT}<br>전형은 매년 바뀌어요. 지원 전 반드시 공식 모집요강을 확인하세요.</p></div>`;
}

function renderList() {
  const items = filtered();
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  document.getElementById("count").textContent = `${items.length}개 학교`;

  if (!items.length) {
    ul.innerHTML = '<div class="empty">조건에 맞는 학교가 없어요. 검색어나 필터를 바꿔보세요.</div>';
  }
  items.forEach(s => {
    const li = document.createElement("li");
    const on = s.id === activeId;
    if (on) li.className = "active";
    li.innerHTML = `<button type="button" aria-expanded="${on}">
      <div class="name">${s.name}<span class="tag">${s.type}</span></div>
      <div class="dept">${s.dept}</div>
      <div class="addr">${s.address}</div></button>${on ? admissionHtml(s) : ""}`;
    li.dataset.id = s.id;
    li.querySelector("button").onclick = () => toggleSchool(s.id);
    ul.appendChild(li);
  });
}

function render() {
  renderList();
  if (view === "cal") renderCal();
  if (mapReady) {
    const items = filtered();
    const visible = new Set(items.map(s => s.id));
    Object.entries(markers).forEach(([id, m]) => m.setMap(visible.has(+id) ? map : null));
    fitToVisible(items);
  }
}

function fitToVisible(items) {
  const pts = items.map(s => coords[s.id]).filter(Boolean);
  if (!pts.length) return;
  if (pts.length === 1) { map.setCenter(pts[0]); map.setZoom(14); return; }
  const b = new naver.maps.LatLngBounds(pts[0], pts[0]);
  pts.forEach(p => b.extend(p));
  map.fitBounds(b, { top: 60, right: 60, bottom: 60, left: 60 });
}

/* ---------- 선택 ---------- */
function pinIcon(on) {
  return { content: `<div class="pin ${on ? "on" : ""}"></div>`, anchor: new naver.maps.Point(15, 30) };
}
function toggleSchool(id) {
  if (id === activeId) {
    activeId = null;      // 이미 펼쳐진 학교를 다시 누르면 접기
    renderList();
    closeInfo();
  } else {
    select(id, true);
  }
  const b = document.querySelector(`#list li[data-id="${id}"] button`);
  if (b) b.focus({ preventScroll: true });
}
function closeInfo() {
  if (infoWindow) infoWindow.close();
  Object.values(markers).forEach(m => m.setIcon(pinIcon(false)));
}
function select(id, fromList) {
  activeId = id;
  const s = SCHOOLS.find(x => x.id === id);
  renderList();
  scrollActive();
  if (!mapReady || !coords[id]) return;

  Object.entries(markers).forEach(([mid, m]) => m.setIcon(pinIcon(+mid === id)));
  map.panTo(coords[id]);
  if (map.getZoom() < 13) map.setZoom(14);

  const q = encodeURIComponent(s.name);
  infoWindow.setContent(`<div class="iw">
    <button type="button" class="iw-x" aria-label="팝업 닫기" onclick="closeInfo()">&times;</button>
    <b>${s.name}</b>
    <div>${s.dept}</div>
    <div>${s.address}</div>
    <div class="links">
      <a href="${s.url}" target="_blank" rel="noopener">홈페이지</a>
      <a class="alt" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">길찾기</a>
    </div></div>`);
  infoWindow.open(map, markers[id]);
}
function scrollActive() {
  const on = document.querySelector("#list li.active");
  if (on) on.scrollIntoView({ block: "nearest" });
}

/* ---------- 달력 ---------- */
const KINDS = { "접수": "#2f6fed", "서류": "#334155", "실기": "#e8336d", "면접": "#f59e0b", "발표": "#1f9d6b", "기타": "#9ca3af" };
let view = "cal";
let calY = new Date().getFullYear(), calM = new Date().getMonth();

function shortName(s) { return s.short || s.name.replace(/대학교$/, "대"); }
function dkey(dt) { return dt.getFullYear() + "-" + dt.getMonth() + "-" + dt.getDate(); }

function buildEvents(schools) {
  const ev = [];
  schools.forEach(s => {
    const a = ADMISSION[s.id] || {};
    const sn = shortName(s);
    const push = (obj, label, ref) => {
      const ap = obj.apply || {};
      const as = pd(ap.start);
      if (as) ev.push({ sid: s.id, school: sn, title: label + " 원서 접수", method: ap.note || "", kind: "접수", start: as, end: pd(ap.end) || as, ref });
      (obj.stages || []).forEach(st => {
        const ds = pd(st.date);
        if (ds) {
          const kind = KINDS[st.kind] ? st.kind : "기타";
          ev.push({ sid: s.id, school: sn, title: label + " " + (st.label || "전형"), method: st.method || "", kind, start: ds, end: pd(st.endDate) || ds, ref });
        }
        const da = pd(st.announce);
        if (da) ev.push({ sid: s.id, school: sn, title: label + " " + (st.label || "전형") + " 합격자 발표", method: "", kind: "발표", start: da, end: da, ref });
      });
      const fa = pd(obj.finalAnnounce);
      if (fa) ev.push({ sid: s.id, school: sn, title: label + " 최종 합격자 발표", method: "", kind: "발표", start: fa, end: fa, ref });
    };
    admGroups(a).forEach(gr => {
      const g = gr.g || {};
      const gref = !!g.reference;
      push(g, gr.name, gref);
      (g.types || []).forEach(t => push(t, gr.name + " " + (t.short || t.name || "전형"), gref || !!t.reference));
    });
  });
  ev.forEach(e => { if (e.end < e.start) e.end = e.start; });
  return ev.sort((x, y) => x.start - y.start || x.school.localeCompare(y.school));
}

function initCalMonth() {
  // 오늘 이후 가장 가까운 일정이 있는 달, 없으면 가장 마지막 일정이 있는 달, 그것도 없으면 이번 달
  const ev = buildEvents(SCHOOLS);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const upcoming = ev.find(e => e.end >= today);
  const pick = upcoming ? upcoming.start < today ? today : upcoming.start : ev.length ? ev[ev.length - 1].start : today;
  calY = pick.getFullYear(); calM = pick.getMonth();
}

function renderCal() {
  const box = document.getElementById("cal");
  const events = buildEvents(filtered());
  const first = new Date(calY, calM, 1);
  const daysIn = new Date(calY, calM + 1, 0).getDate();
  const rows = Math.ceil((first.getDay() + daysIn) / 7);
  const gridStart = new Date(calY, calM, 1 - first.getDay());
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // 날짜별 이벤트
  const byDay = {};
  events.forEach(e => {
    const d = new Date(e.start);
    for (let i = 0; i < 62 && d <= e.end; i++) {
      (byDay[dkey(d)] = byDay[dkey(d)] || []).push(e);
      d.setDate(d.getDate() + 1);
    }
  });

  const evBtn = e => `<button type="button" class="ev${e.ref ? " ref" : ""}" style="--kc:${KINDS[e.kind]}" data-sid="${e.sid}" title="${e.school} ${e.title}${e.method ? " · " + e.method : ""}${e.ref ? " (참고)" : ""}">${e.school} ${e.title}</button>`;

  let cells = "";
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const list = byDay[dkey(d)] || [];
    const cls = ["day", d.getMonth() !== calM ? "out" : "", +d === +today ? "today" : ""].join(" ");
    cells += `<div class="${cls}"><span class="dn">${d.getDate()}</span>${list.slice(0, 3).map(evBtn).join("")}${list.length > 3 ? `<span class="more">+${list.length - 3}개 더</span>` : ""}</div>`;
  }

  // 이번 달 일정 목록
  const mStart = new Date(calY, calM, 1), mEnd = new Date(calY, calM, daysIn);
  const inMonth = events.filter(e => e.end >= mStart && e.start <= mEnd);
  const mlist = inMonth.length
    ? inMonth.map(e => `<button type="button" class="mitem" style="--kc:${KINDS[e.kind]}" data-sid="${e.sid}">
        <span class="mdot"></span><span class="mdate">${fmtRange(toStr(e.start), toStr(e.end))}</span>
        <span class="mtxt"><b>${e.school}</b> ${e.title}${e.method ? " · " + e.method : ""}${e.ref ? '<span class="mref">참고</span>' : ""}</span></button>`).join("")
    : `<div class="mnone">이 달에는 표시할 전형 일정이 없어요.<br>일정은 universities.json의 <code>apply</code>·<code>stages</code>에 날짜(YYYY-MM-DD)를 입력하면 표시돼요.</div>`;

  box.innerHTML = `
    <div class="cal-head">
      <h2 class="cal-title">${calY}년 ${calM + 1}월</h2>
      <button type="button" class="cal-btn" data-nav="-1" aria-label="이전 달">‹ 이전</button>
      <button type="button" class="cal-btn" data-nav="0">오늘</button>
      <button type="button" class="cal-btn" data-nav="1" aria-label="다음 달">다음 ›</button>
    </div>
    <div class="legend">${Object.entries(KINDS).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("")}<span>점선 = 이전 학년도 참고 일정</span></div>
    <div class="grid">${WD.map(w => `<div class="dow">${w}</div>`).join("")}${cells}</div>
    <div class="mlist"><h3>${calM + 1}월 전형 일정 (${inMonth.length}건)</h3>${mlist}</div>`;
}
function toStr(dt) {
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}

document.getElementById("cal").addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const n = +nav.dataset.nav;
    if (n === 0) { const t = new Date(); calY = t.getFullYear(); calM = t.getMonth(); }
    else { const d = new Date(calY, calM + n, 1); calY = d.getFullYear(); calM = d.getMonth(); }
    renderCal(); return;
  }
  const ev = e.target.closest("[data-sid]");
  if (ev) select(+ev.dataset.sid, true);
});

function setView(v) {
  view = v;
  document.body.classList.toggle("cal-mode", v === "cal");
  document.getElementById("cal").hidden = v !== "cal";
  document.getElementById("tabMap").classList.toggle("on", v === "map");
  document.getElementById("tabCal").classList.toggle("on", v === "cal");
  document.getElementById("tabMap").setAttribute("aria-pressed", v === "map");
  document.getElementById("tabCal").setAttribute("aria-pressed", v === "cal");
  if (v === "cal") renderCal();
  else if (mapReady) setTimeout(() => {
    naver.maps.Event.trigger(map, "resize");
    if (activeId && coords[activeId]) map.setCenter(coords[activeId]);
    else fitToVisible(filtered());
  }, 0);
}
document.getElementById("tabMap").onclick = () => setView("map");
document.getElementById("tabCal").onclick = () => setView("cal");

/* ---------- 네이버 지도 초기화 ---------- */
function showMapMessage(html) {
  const el = document.getElementById("mapMsg");
  el.innerHTML = html; el.classList.add("show");
}

function initMap() {
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(36.5, 127.8), zoom: 7,
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
  });
  infoWindow = new naver.maps.InfoWindow({ borderWidth: 0, backgroundColor: "#fff", anchorSize: new naver.maps.Size(12, 10), pixelOffset: new naver.maps.Point(0, -8) });
  naver.maps.Event.addListener(map, "click", () => infoWindow.close());
  mapReady = true;

  // 주소 → 좌표 (Geocoder). 학교마다 한 번씩 요청.
  let pending = SCHOOLS.length;
  SCHOOLS.forEach(s => {
    naver.maps.Service.geocode({ query: s.address }, (status, res) => {
      if (status === naver.maps.Service.Status.OK && res.v2.addresses.length) {
        const a = res.v2.addresses[0];
        const pos = new naver.maps.LatLng(+a.y, +a.x);
        coords[s.id] = pos;
        const m = new naver.maps.Marker({ position: pos, map, title: s.name, icon: pinIcon(false) });
        naver.maps.Event.addListener(m, "click", () => select(s.id));
        markers[s.id] = m;
      } else {
        console.warn("주소 변환 실패:", s.name, s.address);
      }
      if (--pending === 0) render();
    });
  });
}

// 인증 실패 시 (Client ID 오류 / 허용 도메인 미등록)
window.navermap_authFailure = function () {
  showMapMessage("네이버 지도 인증에 실패했어요.<br>Client ID가 맞는지, <b>Web 서비스 URL</b>에 현재 주소(예: <code>http://localhost</code>)가 등록돼 있는지 확인하세요.");
};

function loadNaver() {
  if (!NAVER_CLIENT_ID || NAVER_CLIENT_ID === "YOUR_NCP_CLIENT_ID") {
    showMapMessage("지도를 보려면 파일 상단의 <code>NAVER_CLIENT_ID</code>에<br>네이버 클라우드 플랫폼에서 발급한 Client ID를 넣어주세요.<br>(그 전에도 왼쪽 목록은 사용할 수 있어요.)");
    return;
  }
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(NAVER_CLIENT_ID)}&submodules=geocoder`;
  s.onerror = () => showMapMessage("네이버 지도 스크립트를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
  s.onload = () => {
    // geocoder 서브모듈까지 준비되면 초기화 (중복 실행 방지)
    if (naver.maps.Service) initMap();
    else naver.maps.onJSContentLoaded = () => { if (!mapReady) initMap(); };
  };
  document.head.appendChild(s);
}

document.getElementById("ftoggle").onclick = function () {
  const box = document.getElementById("filterBox");
  const open = box.classList.toggle("open");
  this.setAttribute("aria-expanded", open);
  this.textContent = open ? "필터 닫기 ▴" : "필터 열기 ▾";
};

loadData()
  .then(() => { buildAllChips(); initCalMonth(); render(); loadNaver(); })
  .catch(err => {
    console.error(err);
    document.getElementById("list").innerHTML =
      '<div class="empty">학교 데이터(universities.json)를 불러오지 못했어요.<br>HTML 파일과 같은 폴더에 있는지, 그리고 localhost(예: VS Code Live Server)로 열었는지 확인하세요.</div>';
    showMapMessage("학교 데이터를 불러오지 못해 지도를 표시할 수 없어요.");
  });
</script>
